apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "libvirt-kubernetes-exporter.clusterScopedName" . }}-admin
  labels:
    {{- include "libvirt-kubernetes-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kvm.cloud.sap"]
    resources:
      - {{ include "libvirt-kubernetes-exporter.libvirtDomainResource" . | quote }}
      - {{ include "libvirt-kubernetes-exporter.libvirtDomainHeartbeatResource" . | quote }}
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kvm.cloud.sap"]
    resources:
      - {{ printf "%s/status" (include "libvirt-kubernetes-exporter.libvirtDomainResource" .) | quote }}
      - {{ printf "%s/status" (include "libvirt-kubernetes-exporter.libvirtDomainHeartbeatResource" .) | quote }}
    verbs: ["get", "update", "patch"]
